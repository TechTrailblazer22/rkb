# Render Blueprint: one free web service. Secrets are set in the dashboard (sync: false).
# Free tier: sleeps after 15 min idle, 750 instance hours/month, ephemeral disk.
# Keep this to ONE service or the monthly free hours run out.
services:
  - type: web
    name: rkb-platform
    runtime: node
    plan: free
    region: singapore # closest Render region to India; confirm in the dashboard
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_SECRET
        generateValue: true # Render creates a random value once; it encrypts session cookies
      - key: ADMIN_EMAILS
        sync: false
      # The public URL, e.g. https://rkb-platform.onrender.com (or your custom domain).
      # Used for login redirects and for absolute URLs in page metadata and share images,
      # which are fixed at build time. Set it before the first deploy of a new domain.
      - key: APP_BASE_URL
        sync: false
