name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rkb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rkb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/rkb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Applies every migration to an empty database, exactly as Render does on deploy.
      - run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
      # Includes the integration tests, which run because TEST_DATABASE_URL is set.
      - run: npm test
      - run: npm run build
        env:
          # build never touches the database; a placeholder keeps env validation happy
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
